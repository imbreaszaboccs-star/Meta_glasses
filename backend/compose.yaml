# docker compose up -d --build                    -> API on 127.0.0.1:8000 (behind your existing nginx/Caddy)
# docker compose --profile caddy up -d --build    -> also starts Caddy on :80/:443 with HTTPS for lens.projectviridis.dev
services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    profiles: [caddy]
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  caddy_data:
  caddy_config:
